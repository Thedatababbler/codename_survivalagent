[project]
name = "adamas-unit"
version = "0.0.1"
description = "AdaMAS-unit: unit-chain multi-stage code generation under a repo-wide budget ledger, with an evolvable budget planner"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml>=6",
    "mini-swe-agent==2.4.6",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestra", "src/adamas_unit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
